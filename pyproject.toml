[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mixplant"
version = "0.3.0"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mixplant = "mixplant.__main__:main"

[tool.setuptools.packages.find]
include = ["mixplant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
