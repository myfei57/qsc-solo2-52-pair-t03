<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Recipe book</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; background: #f5f6f8; color: #1c1f24; }
    table { border-collapse: collapse; width: 100%; background: #fff; }
    th, td { border: 1px solid #d7dbe0; padding: 0.4rem 0.6rem; text-align: left; font-size: 0.9rem; }
    form { background: #fff; padding: 1rem; border: 1px solid #d7dbe0; margin-bottom: 1rem; }
    input, button { padding: 0.35rem 0.5rem; margin: 0.2rem; }
    nav a { margin-right: 0.8rem; }
  </style>
</head>
<body>
  <nav><a href="/pages/recipe">recipe</a><a href="/pages/batch">batch</a><a href="/pages/discharge">discharge</a><a href="/pages/alarms">alarms</a></nav>
  <h1>Recipe book</h1>
  <form id="publish">
    <input name="name" placeholder="recipe name" value="mix-a">
    <input name="grade" placeholder="grade" value="C30">
    <input name="sand" placeholder="sand kg/m3" value="760">
    <input name="gravel" placeholder="gravel kg/m3" value="1010">
    <input name="cement" placeholder="cement kg/m3" value="330">
    <input name="water" placeholder="water L/m3" value="175">
    <input name="moisture_ref_percent" placeholder="moisture %" value="4.5">
    <button type="submit">publish</button>
  </form>
  <form id="select">
    <input name="name" placeholder="recipe name" value="mix-a">
    <button type="submit">select</button>
  </form>
  <table id="recipes"><thead><tr><th>name</th><th>grade</th><th>version</th><th>selected</th></tr></thead><tbody></tbody></table>
  <script id="plant-state" type="application/json"><!--STATE--></script>
  <script>
    const state = JSON.parse(document.getElementById('plant-state').textContent || '{"book":{"recipes":[]}}');
    const body = document.querySelector('#recipes tbody');
    for (const entry of state.book.recipes) {
      const row = document.createElement('tr');
      row.innerHTML = `<td>${entry.name}</td><td>${entry.current.grade.code}</td><td>${entry.current.version}</td><td>${entry.selected}</td>`;
      body.appendChild(row);
    }
    async function post(path, form) {
      const payload = Object.fromEntries(new FormData(form).entries());
      const response = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      return response.json();
    }
    document.getElementById('publish').addEventListener('submit', async (event) => { event.preventDefault(); console.log(await post('/api/recipe/publish', event.target)); location.reload(); });
    document.getElementById('select').addEventListener('submit', async (event) => { event.preventDefault(); console.log(await post('/api/recipe/select', event.target)); location.reload(); });
  </script>
</body>
</html>
